name: Domino Data Lab
description: >-
  Domino Data Lab is an enterprise MLOps and AI platform used by data science and
  machine learning teams to build, deploy, monitor, and govern models and data-science
  applications across hybrid and multi-cloud infrastructure. The platform exposes a
  REST Platform API (apps, projects, model serving, environments, workspaces, cost,
  users/orgs, extensions, and data sources), a separate Domino Data API for data
  access, and a Model Monitoring API, alongside official Python (python-domino) and
  R clients, a VS Code extension, and an official Model Context Protocol server
  distributed through its Claude Code plugin. Originally surfaced as a portfolio
  company of bloomberg-beta and enriched from its public developer surface.
